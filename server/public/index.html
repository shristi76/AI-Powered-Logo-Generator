<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Logo Generator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">LogoGen :)</div>

    <div class="nav">
        <button id="aboutBtn">About</button>
     </div>
</div>


<div class="app">
    <h1>AI Logo Generator</h1>

    <input id="promptInput" placeholder="Describe your logo idea" />
    <button id="generateBtn">Generate Logo</button>

    <p id="status"></p>

    <img id="logoImage" />
    <button id="downloadBtn" disabled>Download</button>
</div>

<footer class="footer">
    <h2>Make your day :)</h2>
</footer>

<script src="script.js"></script>
</body>
</html>
